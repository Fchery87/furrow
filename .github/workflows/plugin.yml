# Checks the VST3 and CLAP plugin in plugin/ on Linux, macOS and Windows.
#
# - Engine tests: the engine's own tests and the SeqCore golden traces, with sanitizers where the
#   compiler has them.
# - Golden traces: regenerates the traces from SeqCore and fails if they differ from the committed
#   ones, so a SeqCore change cannot leave the engine testing against old behaviour.
# - Plugin: builds the plugin, runs its processor tests, pluginval, Steinberg's VST3 validator and
#   clap-validator on it, and uploads the built plugin so it can be tried in hosts this repository
#   cannot run.
#
# Downloaded tools are pinned to a version and checked against their SHA-256, and actions are
# pinned to a commit.

name: Plugin

on:
  push:
    paths:
      - "plugin/**"
      - "jsfx/furrow_seqcore.jsfx"
      - "tools/jsfx_host/**"
      - "probes/expected/**"
      - ".audit/results/2026-10-18/**"
      - ".gitattributes"
      - ".github/workflows/plugin.yml"
  pull_request:
    paths:
      - "plugin/**"
      - "jsfx/furrow_seqcore.jsfx"
      - "tools/jsfx_host/**"
      - "probes/expected/**"
      - ".audit/results/2026-10-18/**"
      - ".gitattributes"
      - ".github/workflows/plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PLUGINVAL_VERSION: v1.0.4
  CLAP_VALIDATOR_VERSION: "0.4.1"
  CLAP_VALIDATOR_BUILD: 0.4.1-127-g152b982
  VST3_SDK_TAG: v3.8.1_build_84

jobs:
  engine-tests:
    name: Engine tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC, os: ubuntu-24.04, compilers: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++, sanitize: "ON" }
          - { name: Linux Clang, os: ubuntu-24.04, compilers: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++, sanitize: "ON" }
          - { name: macOS, os: macos-15, compilers: "", sanitize: "ON" }
          # MSVC's address sanitizer needs extra runtime setup and it has no UB sanitizer, so the
          # Windows run checks the compiler and the exact arithmetic without sanitizers.
          - { name: Windows MSVC, os: windows-2025, compilers: "", sanitize: "OFF" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Let ASan map its shadow memory
        if: runner.os == 'Linux'
        # Ubuntu 24.04 randomises mmap over more address bits than older sanitizer runtimes expect.
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Debug ${{ matrix.compilers }}
          -DFURROW_BUILD_PLUGIN=OFF -DFURROW_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  golden-traces:
    name: Golden traces match SeqCore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the ysfx host
        run: tools/jsfx_host/build.sh "$RUNNER_TEMP/jsfx_host"

      - name: Regenerate the traces
        run: python3 plugin/tests/golden/make_golden.py

      - name: Compare with the committed traces
        run: |
          if [ -n "$(git status --porcelain -- plugin/tests/golden)" ]; then
            git status --short -- plugin/tests/golden
            git diff --stat -- plugin/tests/golden
            echo "::error::SeqCore's behaviour no longer matches plugin/tests/golden. Run python3 plugin/tests/golden/make_golden.py, commit the traces, then make the engine pass them."
            exit 1
          fi

  plugin:
    name: Plugin (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            cmake_args: ""
            pluginval_zip: pluginval_Linux.zip
            pluginval_sha256: c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
            pluginval_exe: pluginval
            clap_validator_asset: ubuntu-22.04
            clap_validator_sha256: 49edadcfb407ea0dd946ce418300e853fbd2660fa4b0d00e4f19ff8eef24ad90
            # pluginval is a JUCE app and needs an X display even on the command line.
            run_prefix: xvfb-run -a
          - name: macOS
            os: macos-15
            # One download that runs on Apple silicon and Intel Macs.
            cmake_args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
            pluginval_zip: pluginval_macOS.zip
            pluginval_sha256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
            pluginval_exe: pluginval.app/Contents/MacOS/pluginval
            clap_validator_asset: macos-universal
            clap_validator_sha256: bbec8cd7d18274e549d5d8c12ece3cec54be966129388dd2e742b9957f2ba9f1
            run_prefix: ""
          - name: Windows
            os: windows-2025
            cmake_args: ""
            pluginval_zip: pluginval_Windows.zip
            pluginval_sha256: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab
            pluginval_exe: pluginval.exe
            clap_validator_asset: windows
            clap_validator_sha256: d935c3af0a45c3911ea2e900f4aa5d6709dac82bb485f0c4ce28648ab2cd0c10
            run_prefix: ""
    env:
      ARTEFACTS: build/FurrowSpike_artefacts/Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose a tools folder
        # pwd gives the bash form of the path on Windows too, which the later steps need.
        run: echo "TOOLS=$(cd "$RUNNER_TEMP" && pwd)/tools" >> "$GITHUB_ENV"

      - name: Install Linux packages
        if: runner.os == 'Linux'
        # JUCE's packages for the modules the plugin uses (plugin/build/_deps/juce-src/docs/Linux
        # Dependencies.md), less the ones turned off in plugin/CMakeLists.txt, plus Xvfb.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev xvfb

      - name: Configure
        run: cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Processor tests
        run: ${{ matrix.run_prefix }} ctest --test-dir build -C Release --output-on-failure -R furrow_plugin_tests

      - name: Get the validators
        run: |
          check() { # file sha256
            if command -v sha256sum >/dev/null; then echo "$2  $1" | sha256sum -c -
            else echo "$2  $1" | shasum -a 256 -c -; fi
          }
          mkdir -p "$TOOLS" && cd "$TOOLS"

          curl -fsSLo pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/${{ matrix.pluginval_zip }}"
          check pluginval.zip "${{ matrix.pluginval_sha256 }}"
          unzip -q pluginval.zip -d pluginval

          name="clap-validator-$CLAP_VALIDATOR_BUILD-${{ matrix.clap_validator_asset }}.zip"
          curl -fsSLo clap-validator.zip "https://github.com/free-audio/clap-validator/releases/download/$CLAP_VALIDATOR_VERSION/$name"
          check clap-validator.zip "${{ matrix.clap_validator_sha256 }}"
          # The Linux and macOS zips hold a tarball; the Windows zip holds the program.
          unzip -q clap-validator.zip -d clap-validator
          for archive in clap-validator/*.tar.gz; do
            [ -e "$archive" ] && tar -xzf "$archive" -C clap-validator
          done

          # Steinberg publishes its validator as source in the VST3 SDK, pinned here by tag.
          git -c advice.detachedHead=false clone -q --depth 1 -b "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          git -C vst3sdk submodule update -q --init --depth 1 base pluginterfaces public.sdk cmake
          cmake -S vst3sdk -B vst3sdk/build -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_RUN_VST_VALIDATOR=OFF
          cmake --build vst3sdk/build --config Release --target validator --parallel

      - name: pluginval (VST3, strictness 10)
        run: ${{ matrix.run_prefix }} "$TOOLS/pluginval/${{ matrix.pluginval_exe }}" --strictness-level 10 --validate "$ARTEFACTS/VST3/Furrow Spike.vst3"

      - name: Steinberg VST3 validator
        run: |
          validator=$(find "$TOOLS/vst3sdk/build/bin" -type f \( -name validator -o -name validator.exe \) | head -n 1)
          "$validator" "$ARTEFACTS/VST3/Furrow Spike.vst3"

      - name: clap-validator
        run: |
          validator=$(find "$TOOLS/clap-validator" -type f \( -name clap-validator -o -name clap-validator.exe \) | head -n 1)
          # param-conversions divides by the parameter count, and the plugin has no parameters
          # until the interface adds them, so clap-validator 0.4.1 crashes there ("a bug in the
          # validator"). Drop this exclusion once the plugin has parameters.
          "$validator" validate --exclude '^param-conversions$' "$ARTEFACTS/CLAP/Furrow Spike.clap"

      - name: Package
        # A tarball keeps the macOS bundle's symlinks and the executable bits that a plain
        # artifact upload drops. Windows users get a zip, which Explorer opens.
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            (cd "$ARTEFACTS" && 7z a -tzip "$GITHUB_WORKSPACE/dist/furrow-spike-windows.zip" VST3 CLAP >/dev/null)
          else
            os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
            tar -czf "dist/furrow-spike-$os.tar.gz" -C "$ARTEFACTS" VST3 CLAP
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: furrow-spike-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
