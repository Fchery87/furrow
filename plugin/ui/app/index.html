<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Furrow</title><style>
:root{color-scheme:dark;--bg:#241f1b;--panel:#2a241f;--ridge:#3b342d;--line:#4a4038;--text:#dcd0ba;--dim:#a0947f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui,sans-serif}.app{height:100vh;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}h1{margin:0 18px 0 0;font-size:25px}.top select,.top input,.btn,.field input,.field select{background:#1a1613;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:6px}.btn{cursor:pointer}.spacer{flex:1}.main{display:grid;grid-template-columns:1fr 270px;min-height:0}.rack{overflow:auto;padding:12px}.lane{display:grid;grid-template-columns:190px 1fr;gap:8px;margin-bottom:5px;min-width:900px}.head{display:flex;align-items:center;gap:5px}.head b{width:5px;height:27px;background:var(--c);border-radius:2px}.head button{background:var(--ridge);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:5px}.name{flex:1;text-align:left}.steps{display:grid;grid-template-columns:repeat(64, minmax(16px,1fr));gap:2px;background:#1a1613;padding:4px;border-radius:6px}.step{height:31px;border:0;border-radius:3px;background:var(--ridge);position:relative;padding:0}.step.on{background:var(--c)}.step.now{outline:2px solid #f4e9d2}.step span{position:absolute;bottom:0;left:0;right:0;background:#f4e9d2;opacity:.4}.side{background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto}.side h2{margin-top:0}.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:var(--dim)}#error{color:#e8a091}.toolbar{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.toolbar .btn{font-size:12px}</style></head><body><div class="app"><header class="top"><h1>furrow</h1><select id="pattern"></select><button class="btn" id="renamePattern">Rename</button><label>Swing <input id="swing" type="number" min="0" max="100" value="0" style="width:55px"></label><label>Seed <input id="seed" type="number" style="width:75px"></label><span class="spacer"></span><b id="bpm">120 BPM</b><button class="btn" id="undo">Undo</button><button class="btn" id="redo">Redo</button><button class="btn" id="panic">Panic</button></header><main class="main"><section class="rack" id="rack"></section><aside class="side" id="inspector"><h2>No lane</h2></aside></main></div><script>
'use strict';let state={lanes:[],patterns:['Pattern 1'],pattern:0};let selected=0;const S=Array.from({length:17},(_,i)=>i);function emit(x){if(window.__JUCE__?.backend?.emitEvent)window.__JUCE__.backend.emitEvent('edit',x)}function cmd(action,x={}){emit({action,...x})}function esc(x){return String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function render(){pattern.innerHTML=(state.patterns||[]).map((x,i)=>`<option value="${i}" ${i===state.pattern?'selected':''}>${esc(x)}</option>`).join('');bpm.textContent=`${state.bpm||120} BPM`;swing.value=state.globalSwing||0;seed.value=state.seed||0;rack.innerHTML=(state.lanes||[]).map(l=>{let steps=l.steps||[];return `<div class="lane" style="--c:${esc(l.color||'#e2b24a')}"><div class="head"><b></b><button class="name" data-lane="${l.slot}">${esc(l.name)}</button><button data-action="mute" data-lane="${l.slot}">M</button><button data-action="solo" data-lane="${l.slot}">S</button></div><div class="steps">${Array.from({length:512},(_,i)=>{let q=steps[i]||[];return `<button class="step ${q[0]?'on':''} ${i%4===0?'group':''}" data-lane="${l.slot}" data-step="${i}"><span style="height:${Math.max(5,(q[1]||0)/127*100)}%"></span></button>`}).join('')}</div></div>`}).join('');renderInspector()}function renderInspector(){let l=state.lanes?.find(x=>x.slot===selected);inspector.innerHTML=l?`<h2 style="color:${l.color}">${esc(l.name)}</h2><div class="toolbar"><button class="btn" data-action="fill">Fill</button><button class="btn" data-action="rotate">Rotate</button><button class="btn" data-action="invert">Invert</button><button class="btn" data-action="clearLane">Clear</button><button class="btn" data-action="clonePattern">Clone</button></div><div class="grid">${[['length','Length'],['note','Note'],['volume','Volume'],['pan','Pan'],['swing','Swing'],['channel','Channel'],['output','Output'],['start','Start'],['end','End'],['tune','Tune'],['attack','Attack'],['decay','Decay'],['release','Release'],['choke','Choke']].map(([k,n])=>`<label class="field">${n}<input data-field="${k}" type="number" value="${l[k]??0}"></label>`).join('')}</div><label class="field">Target<select data-field="target"><option ${l.target==='sample'?'selected':''}>sample</option><option ${l.target==='midi'?'selected':''}>midi</option></select></label><button class="btn" id="sample">Choose sample</button><p class="muted">${esc(l.samplePath||'No sample loaded')}</p>`:'<h2>No lane</h2>'}function updateField(e){let k=e.target.dataset.field;if(k){let v=e.target.value;cmd(k==='length'?'setLength':'setLane',{lane:selected,field:k,value:k==='target'?v:Number(v)});return}let b=e.target.closest('[data-action]');if(b){let a=b.dataset.action;cmd(a==='fill'?'fill':a==='rotate'?'rotate':a,{lane:selected,value:a==='fill'?2:1})}}rack.addEventListener('click',e=>{let c=e.target.closest('.step');if(c){selected=Number(c.dataset.lane);cmd('setStep',{lane:selected,step:Number(c.dataset.step),field:0,value:1});render()}let n=e.target.closest('.name');if(n){selected=Number(n.dataset.lane);render()}});inspector.addEventListener('change',updateField);inspector.addEventListener('click',updateField);pattern.onchange=()=>cmd('pattern',{value:Number(pattern.value)});swing.onchange=()=>cmd('setSetup',{field:'globalSwing',value:Number(swing.value)});seed.onchange=()=>cmd('setSetup',{field:'seed',value:Number(seed.value)});undo.onclick=()=>cmd('undo');redo.onclick=()=>cmd('redo');panic.onclick=()=>cmd('panic');renamePattern.onclick=()=>cmd('renamePattern',{name:prompt('Pattern name')||''});window.__JUCE__?.backend?.addEventListener('state',s=>{state=typeof s==='string'?JSON.parse(s):s;render()});render();</script></body></html>
