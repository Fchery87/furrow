<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Furrow</title><style>
:root{color-scheme:dark;--bg:#241f1b;--panel:#2d2722;--ridge:#40372f;--line:#55483d;--text:#e5d8c0;--dim:#a99b84;--accent:#d9a84e;--danger:#e99a8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui,sans-serif}.app{height:100vh;display:grid;grid-template-rows:auto 1fr}.top{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}h1{margin:0 18px 0 0;font-size:24px}.btn,select,input{background:#1d1815;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:6px}.btn{cursor:pointer}.btn:hover,.step:hover{border-color:var(--accent)}.spacer{flex:1}.main{display:grid;grid-template-columns:minmax(0,1fr) 290px;min-height:0}.rack{overflow:auto;padding:12px}.lane{display:grid;grid-template-columns:190px minmax(600px,1fr);gap:8px;margin-bottom:7px}.head{display:flex;align-items:center;gap:5px}.head b{width:5px;height:30px;background:var(--c);border-radius:2px}.head button{background:var(--ridge);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:5px}.name{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis}.steps{display:grid;grid-template-columns:repeat(var(--cols),minmax(16px,1fr));gap:2px;background:#1b1714;padding:4px;border-radius:6px}.step{height:31px;border:1px solid transparent;border-radius:3px;background:var(--ridge);position:relative;padding:0}.step.on{background:var(--c)}.step:focus-visible{outline:2px solid #f4e9d2}.step span{position:absolute;bottom:0;left:0;right:0;background:#f4e9d2;opacity:.45}.side{background:var(--panel);border-left:1px solid var(--line);padding:15px;overflow:auto}.side h2{margin:0 0 12px}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolbar{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}.muted{color:var(--dim)}#error{color:var(--danger);min-height:18px}.section{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}.swatch{width:100%;height:30px;padding:2px}.kit{display:flex;gap:5px;flex-wrap:wrap}
</style></head><body><div class="app"><header class="top"><h1>furrow</h1><label>Pattern <select id="pattern"></select></label><button class="btn" id="renamePattern">Rename</button><span class="spacer"></span><button class="btn" data-action="undo">Undo</button><button class="btn" data-action="redo">Redo</button><button class="btn" data-action="kitSave">Save kit</button><button class="btn" data-action="kitLoad">Load kit</button><button class="btn" data-action="midiExport">Export MIDI</button></header><main class="main"><section id="rack" class="rack" aria-label="Pattern lanes"></section><aside id="inspector" class="side" aria-label="Inspector"></aside></main></div><script>
'use strict';
const $=id=>document.getElementById(id);let state={lanes:[],patterns:['Pattern 1'],pattern:0};let selected=0;
function emit(action,data={}){const msg={action,...data};if(window.__JUCE__?.backend?.emitEvent)window.__JUCE__.backend.emitEvent('edit',msg)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const names=state.patterns||['Pattern 1'];$('pattern').innerHTML=names.map((n,i)=>`<option value="${i}" ${i===state.pattern?'selected':''}>${esc(n)}</option>`).join('');const lanes=state.lanes||[];$('rack').innerHTML=lanes.map(l=>{const steps=l.steps||[],length=Math.max(1,Math.min(512,Number(l.length)||steps.length||16)),cols=Math.min(64,length);return `<div class="lane" style="--c:${esc(l.color||'#d9a84e')}"><div class="head"><b aria-hidden="true"></b><button class="name" data-lane="${l.slot}" aria-label="Select ${esc(l.name)}">${esc(l.name||'Lane')}</button><button class="btn" data-action="mute" data-lane="${l.slot}" aria-label="Mute ${esc(l.name)}">M</button><button class="btn" data-action="solo" data-lane="${l.slot}" aria-label="Solo ${esc(l.name)}">S</button></div><div class="steps" style="--cols:${cols}">${Array.from({length},(_,i)=>{const q=steps[i]||[];return `<button class="step ${q[0]?'on':''}" data-lane="${l.slot}" data-step="${i}" aria-label="${esc(l.name)} step ${i+1}" aria-pressed="${!!q[0]}"><span style="height:${Math.max(5,(q[1]||0)/127*100)}%"></span></button>`}).join('')}</div></div>`}).join('');renderInspector()}
const laneFields={note:4,mute:5,solo:6,volume:7,pan:8,swing:10};
function currentLane(){return (state.lanes||[]).find(l=>l.slot===selected)}
function editing(){return ['INPUT','SELECT'].includes(document.activeElement?.tagName)}
function renderInspector(){
  if(editing()&&$('inspector').contains(document.activeElement))return;
  const l=currentLane(),preview=state.midiPreview;
  const midi=`<div class="section"><h3>MIDI preview</h3><button class="btn" data-action="midiPreview">Preview MIDI</button><button class="btn" data-action="midiImport" ${preview?.accepted?'':'disabled'}>Replace pattern with MIDI</button>${preview?`<p>${preview.lanes} lanes, ${preview.lengthSteps} steps</p>${(preview.diagnostics||[]).map(d=>`<p>${esc(d.message)}</p>`).join('')}`:''}</div>`;
  const status=`${midi}<p id="error" role="alert">${esc(state.error||'')}</p>`;
  if(!l){$('inspector').innerHTML=`<p class="muted">Select a lane to edit it.</p><button class="btn" data-action="addLane">Add lane</button>${status}`;return}
  const fields=[['length','Length'],['note','Note'],['volume','Volume'],['pan','Pan'],['swing','Swing'],['channel','Channel'],['output','Output'],['start','Start'],['end','End'],['tune','Tune'],['attack','Attack'],['decay','Decay'],['release','Release'],['choke','Choke']];
  $('inspector').innerHTML=`<h2 style="color:${esc(l.color)}">${esc(l.name)}</h2><div class="toolbar"><button class="btn" data-action="audition">Audition</button><button class="btn" data-action="clearLane">Clear steps</button><button class="btn" data-action="addLane">Add lane</button><button class="btn" data-action="panic">Panic</button></div><label class="field">Target<select data-field="target" data-lane="${l.slot}"><option value="midi" ${l.target==='midi'?'selected':''}>MIDI</option><option value="sample" ${l.target==='sample'?'selected':''}>Sample</option></select></label><div class="grid">${fields.map(([k,label])=>`<label class="field">${label}<input data-field="${k}" data-lane="${l.slot}" type="number" step="${['start','end','attack','decay','release'].includes(k)?'any':'1'}" value="${esc(l[k]??0)}"></label>`).join('')}</div><div class="section"><label class="field">Name<input data-field="name" data-lane="${l.slot}" value="${esc(l.name)}"></label><label class="field">Color<input class="swatch" data-field="color" data-lane="${l.slot}" type="color" value="${esc(l.color)}"></label><button class="btn" data-action="chooseSample">Choose sample</button><button class="btn" data-action="retrySample" ${l.samplePath?'':'disabled'}>Retry sample</button><p>${esc(l.samplePath)}</p><p role="status">${esc(l.sampleError)}</p></div>${status}`;
}
$('rack').addEventListener('click',e=>{
  const el=e.target.closest('[data-action],[data-step],[data-lane]');if(!el)return;
  selected=Number(el.dataset.lane);const l=currentLane();if(!l)return;
  if(el.dataset.step!==undefined){const step=Number(el.dataset.step),q=l.steps[step]||[];emit('setStep',{lane:selected,step,field:0,value:q[0]?0:1});return}
  if(el.dataset.action){const field=el.dataset.action;emit('setLane',{lane:selected,field:laneFields[field],value:l[field]?0:1});return}
  emit('selectLane',{lane:selected});renderInspector();
});
$('inspector').addEventListener('change',e=>{
  const field=e.target.dataset.field;if(!field)return;
  const lane=Number(e.target.dataset.lane),value=e.target.type==='number'?Number(e.target.value):e.target.value;
  if(field==='length')emit('setLength',{lane,value});
  else if(field==='name')emit('renameLane',{lane,name:value});
  else if(field==='color')emit('colorLane',{lane,color:value});
  else if(field in laneFields)emit('setLane',{lane,field:laneFields[field],value});
  else emit('setSampler',{lane,field,value});
});
$('inspector').addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
  const action=b.dataset.action;
  if(action==='addLane'){emit(action,{note:60});return}
  if(action==='midiImport'&&!state.midiPreview?.accepted)return;
  if(['midiPreview','midiImport','panic'].includes(action)){emit(action);return}
  if(action==='retrySample'){const path=currentLane()?.samplePath;if(path)emit(action,{lane:selected,path});return}
  emit(action,{lane:selected});
});
$('pattern').addEventListener('change',e=>emit('pattern',{value:Number(e.target.value)}));
$('renamePattern').onclick=()=>{const name=prompt('Pattern name',state.patterns[state.pattern]||'Pattern');if(name)emit('renamePattern',{name})};
document.querySelector('.top').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)emit(b.dataset.action)});
window.__furrowState=s=>{
  state=s||state;
  if(!currentLane())selected=state.lanes?.[0]?.slot??0;
  if(!editing())render();
};
window.__JUCE__?.backend?.addEventListener('state',window.__furrowState);
render();
</script></body></html>
