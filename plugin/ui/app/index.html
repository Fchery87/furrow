<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Furrow</title>
<style>
:root{
  --peat:#241F1B;--furrow:#1A1613;--ridge:#3B342D;--ridge-alt:#322C26;
  --panel:#2A241F;--line:#3E362F;--chaff:#DCD0BA;--chaff-dim:#A0947F;
  --chaff-faint:#6F655A;--focus:#F4E9D2;--danger:#E8A091;--head:236px;
  --inspector:292px;--row-h:44px;--ui:system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;user-select:none}
body{background:var(--peat);color:var(--chaff);font:13px/1.35 var(--ui)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh}

/* Top bar */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wordmark{font-weight:800;font-size:22px;letter-spacing:-0.02em;color:var(--chaff);margin-right:4px}
.pattern-wrap{display:flex;align-items:center;gap:8px}
.pattern-btn{background:none;border:1px solid transparent;padding:4px 8px;border-radius:6px;font-weight:650;font-size:17px;display:flex;align-items:center;gap:6px}
.pattern-btn:hover{background:var(--ridge-alt);border-color:var(--line)}
.pattern-rename{background:var(--furrow);border:1px solid var(--focus);border-radius:6px;padding:4px 8px;font-size:15px;width:160px}
.queued{color:var(--focus);font-size:12px;background:var(--ridge);padding:3px 8px;border-radius:99px}
.transport{display:flex;align-items:center;gap:12px;margin-left:auto}
.play-pill{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--furrow);border:1px solid var(--line);font-size:12px;font-variant-numeric:tabular-nums}
.play-dot{width:8px;height:8px;border-radius:50%;background:var(--chaff-faint)}
.play-pill.playing .play-dot{background:#A3BE6E;box-shadow:0 0 6px #A3BE6E}
.btn{background:var(--ridge-alt);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--ridge);border-color:var(--chaff-dim)}
.btn:disabled{opacity:.42;cursor:default}
.btn.active{background:var(--chaff);color:var(--peat);border-color:var(--chaff)}
.btn.danger{color:var(--danger)}
.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* Main 3-pane layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) var(--inspector);grid-template-rows:minmax(0,1fr) 156px;min-height:0}
.main.browser-open{grid-template-columns:232px minmax(0,1fr) var(--inspector)}
.browser{grid-column:1;grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:10px;gap:8px}
.browser[hidden]{display:none}
.browser-head{display:flex;align-items:center;justify-content:space-between;gap:4px}
.browser-roots{display:flex;flex-direction:column;gap:3px;max-height:108px;overflow-y:auto}
.browser-root{display:flex;align-items:center;gap:4px}
.browser-root .root-btn{flex:1;min-width:0;text-align:left;background:var(--ridge-alt);border:1px solid var(--line);border-radius:5px;padding:4px 7px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.browser-root .root-btn.active{background:var(--ridge);border-color:var(--chaff-dim);color:var(--focus)}
.browser-root .root-rm{width:22px;height:22px;padding:0;border-radius:5px;border:1px solid var(--line);background:none;color:var(--chaff-dim)}
.browser-nav{display:flex;gap:4px;align-items:center}
.browser-filter{flex:1;min-width:0;background:var(--furrow);border:1px solid var(--line);border-radius:5px;padding:4px 7px;font-size:12px}
.browser-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;outline:none}
.browser-item{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:5px;font-size:12px;cursor:pointer}
.browser-item:hover{background:var(--ridge-alt)}
.browser-item.selected{background:var(--ridge);color:var(--focus)}
.browser-item.loaded{border-left:2px solid #E2B24A}
.browser-item .item-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.browser-item .item-add{width:20px;height:20px;padding:0;border-radius:4px;border:1px solid var(--line);background:var(--ridge-alt);font-size:11px;flex:none}
.rack-area{grid-column:1;grid-row:1;display:grid;grid-template-columns:var(--head) minmax(0,1fr);min-height:0;overflow:hidden}
.main.browser-open .rack-area{grid-column:2}
.main.browser-open .editor{grid-column:2}
.main.browser-open .inspector{grid-column:3}
.lane-headers{overflow-y:auto;overflow-x:hidden;padding:10px 6px 10px 14px;border-right:1px solid var(--line)}
.lane-headers::-webkit-scrollbar{width:0}
.lane-row{height:var(--row-h);display:flex;align-items:center;gap:6px;padding:0 4px;border-radius:6px}
.lane-row.selected{background:var(--ridge-alt)}
.lane-row.muted .lane-name,.lane-row.silenced .lane-name{color:var(--chaff-faint)}
.chip{width:5px;height:28px;border-radius:3px;background:var(--lane);flex:none}
.lane-name{flex:1;min-width:0;text-align:left;background:none;border:0;padding:5px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.lane-name:hover{background:var(--ridge)}
.lane-row.selected .lane-name{color:var(--focus)}
.badge{font-size:11px;color:var(--chaff-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.warn{color:var(--danger)}
.ms{width:24px;height:24px;flex:none;border-radius:5px;border:1px solid var(--line);background:var(--ridge-alt);font-size:11px;font-weight:700;color:var(--chaff-dim);padding:0}
.ms.m[aria-pressed="true"]{background:var(--chaff-dim);color:var(--peat);border-color:var(--chaff-dim)}
.ms.s[aria-pressed="true"]{background:var(--focus);color:var(--peat);border-color:var(--focus)}
.meter{width:4px;height:28px;border-radius:2px;background:var(--furrow);overflow:hidden;display:flex;align-items:flex-end;flex:none}
.meter-fill{width:100%;height:0%;background:#A3BE6E;transition:height 45ms linear}
.drag-handle{cursor:grab;color:var(--chaff-faint);font-size:12px;padding:0 2px;flex:none}
.lane-row.drag-over{outline:1.5px solid var(--focus)}
.bank-pop{position:fixed;z-index:35;width:320px;background:#332C26;border:1px solid #4A4038;border-radius:10px;padding:10px;box-shadow:0 14px 32px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:8px}
.bank-tabs{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.bank-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pat-cell{position:relative;background:var(--ridge-alt);border:1px solid var(--line);border-radius:5px;padding:6px 4px;font-size:11px;text-align:center}
.pat-cell.active{background:var(--chaff);color:var(--peat);border-color:var(--chaff);font-weight:700}
.pat-cell.has-data::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:#E2B24A}
.bpm-input{width:54px;background:var(--furrow);border:1px solid var(--line);border-radius:5px;padding:2px 5px;text-align:right;font-variant-numeric:tabular-nums}
.drop-zone{margin-top:8px;min-height:42px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--chaff-dim);font-size:12px;padding:6px}
.grid-scroll{overflow:auto;padding:10px 12px 10px 8px;background:var(--peat);position:relative}
#gridCanvas{display:block;cursor:pointer;touch-action:none}

/* Step lane editor */
.editor{grid-column:1;grid-row:2;display:grid;grid-template-columns:var(--head) minmax(0,1fr);border-top:1px solid var(--line);background:#211C18;min-height:0}
.tabs{overflow-y:auto;padding:8px 8px 8px 14px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.tab{text-align:left;background:none;border:0;padding:3px 8px;border-radius:5px;color:var(--chaff-dim);font-size:12px;border-left:3px solid transparent}
.tab:hover{color:var(--chaff)}
.tab[aria-selected="true"]{color:var(--focus);background:var(--ridge-alt);border-left-color:var(--lane,#E2B24A)}
.bars-scroll{overflow-x:auto;overflow-y:hidden;padding:10px 12px 10px 8px}
#barsCanvas{display:block;cursor:ns-resize;touch-action:none}

/* Inspector */
.inspector{grid-column:2;grid-row:1/3;background:var(--panel);border-left:1px solid var(--line);padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.lane-title{display:flex;align-items:center;gap:8px}
.lane-title input{flex:1;min-width:0;background:none;border:1px solid transparent;border-radius:6px;padding:3px 6px;margin-left:-6px;font-weight:700;font-size:18px}
.lane-title input:hover,.lane-title input:focus{border-color:var(--line);background:var(--furrow)}
.field{display:flex;flex-direction:column;gap:5px}
.label{font-size:11px;color:var(--chaff-dim);text-transform:uppercase;letter-spacing:0.04em}
.segmented{display:flex;background:var(--furrow);border-radius:7px;padding:2px;gap:2px}
.segmented button{flex:1;border:0;background:none;border-radius:5px;padding:5px 4px;font-size:12px;color:var(--chaff-dim)}
.segmented button[aria-checked="true"]{background:var(--ridge);color:var(--focus)}
.wave{width:100%;height:58px;display:block;background:var(--furrow);border-radius:7px}
.caption{font-size:12px;color:var(--chaff-dim);word-break:break-all}
.knobs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 4px}
.knob{display:flex;flex-direction:column;align-items:center;gap:2px}
.knob .dial{width:42px;height:42px;border-radius:50%;touch-action:none;cursor:ns-resize}
.knob svg{width:42px;height:42px;display:block}
.knob .k-label{font-size:11px;color:var(--chaff-dim)}
.knob output{font-size:11px;color:var(--chaff);font-variant-numeric:tabular-nums}
.knob.small{flex-direction:row;gap:6px}
.knob.small .dial,.knob.small svg{width:30px;height:30px}
.knob.small .k-text{display:flex;flex-direction:column;line-height:1.15}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num-input,select{width:100%;background:var(--furrow);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.stepper{display:flex;align-items:center;gap:5px}
.stepper button{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:var(--ridge-alt);padding:0}
.stepper output{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;font-size:12px}
.swatches{display:flex;gap:7px;align-items:center}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0}
.swatch[aria-checked="true"]{border-color:var(--focus);box-shadow:0 0 0 2px var(--panel) inset}
.color-pick{width:24px;height:24px;padding:0;border:1px solid var(--line);border-radius:5px;background:none}
.tools-grid{display:flex;flex-wrap:wrap;gap:5px}
.section{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}

/* Footer */
.hint{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:6px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--chaff-dim);min-height:30px}
#error{color:var(--danger);font-weight:500}

/* Context menu */
.menu{position:fixed;z-index:30;min-width:190px;background:#332C26;border:1px solid #4A4038;border-radius:8px;padding:4px;box-shadow:0 12px 28px rgba(0,0,0,.5)}
.menu button{display:flex;justify-content:space-between;gap:14px;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:5px;font-size:12px}
.menu button:hover,.menu button:focus{background:#463C34;outline:none}
.menu button[aria-checked="true"]::after{content:"✓";color:var(--focus)}
.menu hr{border:0;border-top:1px solid #4A4038;margin:4px 6px}
.menu .danger{color:var(--danger)}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="wordmark">furrow</div>
    <button class="btn" id="browserToggleBtn" aria-pressed="false" data-hint="Toggle collapsible sample library browser.">Browser</button>
    <div class="pattern-wrap" id="patternWrap">
      <button class="pattern-btn" id="patternBtn" aria-haspopup="menu" data-hint="Switch, rename, clone or clear patterns. While playing, switches queue for the next bar."><span id="patternName">Pattern 1</span><span aria-hidden="true">▾</span></button>
      <span class="queued" id="queuedBadge" hidden></span>
    </div>
    <div class="transport">
      <button class="btn" id="standalonePlayBtn" hidden data-hint="Play or stop standalone transport (Space).">Play</button>
      <div class="play-pill" id="playPill" data-hint="Transport state and tempo."><span class="play-dot"></span><span id="bpmText">120 BPM</span><input class="bpm-input" id="bpmInput" type="number" min="20" max="300" step="1" value="120" hidden aria-label="Standalone BPM"></div>
      <div id="globalSwingSlot"></div>
      <button class="btn" id="truncateBtn" aria-pressed="false" data-hint="Truncate swung notes before the next step boundary.">Truncate</button>
      <button class="btn" id="seedBtn" data-hint="Reroll probability seed.">Seed <span id="seedVal">0</span></button>
    </div>
    <div class="actions">
      <button class="btn" id="undoBtn" data-action="undo" disabled>Undo</button>
      <button class="btn" id="redoBtn" data-action="redo" disabled>Redo</button>
      <button class="btn" data-action="kitSave">Save kit</button>
      <button class="btn" data-action="kitLoad">Load kit</button>
      <button class="btn" data-action="midiExport">Export MIDI</button>
      <button class="btn" id="dragMidiBtn" data-hint="Drag this pattern onto your host timeline as a MIDI file.">Drag MIDI</button>
      <button class="btn" id="dragWavBtn" data-hint="Drag this pattern onto your host timeline as a 24-bit WAV loop.">Drag WAV</button>
      <button class="btn" id="wavTailBtn" aria-pressed="false" data-hint="Include up to 2 seconds of ringing tail when dragging WAV.">Tail</button>
      <button class="btn danger" data-action="panic">Panic</button>
    </div>
  </header>

  <main class="main" id="mainLayout">
    <aside class="browser" id="browserPane" hidden aria-label="Sample browser">
      <div class="browser-head">
        <span class="label">Samples</span>
        <div class="actions">
          <button class="btn" id="browserAutoSwapBtn" aria-pressed="false" data-hint="When active, Up/Down arrows hot-swap the selected lane live.">Auto-swap</button>
          <button class="btn" id="browserAddFolderBtn">+ Folder</button>
        </div>
      </div>
      <div class="browser-roots" id="browserRoots"></div>
      <div class="browser-nav">
        <button class="btn" id="browserUpBtn" disabled>..</button>
        <input class="browser-filter" id="browserFilterInput" type="search" placeholder="Filter samples..." aria-label="Filter browser">
      </div>
      <div class="browser-list" id="browserList" tabindex="0" role="listbox" aria-label="Sample files"></div>
    </aside>
    <section class="rack-area" aria-label="Pattern rack">
      <div class="lane-headers" id="laneHeaders"></div>
      <div class="grid-scroll" id="gridScroll">
        <canvas id="gridCanvas" tabindex="0" aria-label="Step grid"></canvas>
      </div>
    </section>

    <section class="editor" aria-label="Step lane editor">
      <div class="tabs" id="stepTabs" role="tablist" aria-orientation="vertical"></div>
      <div class="bars-scroll" id="barsScroll">
        <canvas id="barsCanvas" aria-label="Step parameter bars"></canvas>
      </div>
    </section>

    <aside class="inspector" id="inspector" aria-label="Lane inspector"></aside>
  </main>

  <footer class="hint">
    <span id="hintText">Click to toggle, drag to paint, right-drag to erase, Shift-drag for velocity, Alt-click for probability.</span>
    <span id="error" role="alert"></span>
  </footer>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const PALETTE = ['#E2B24A','#8DB3D6','#C987AE','#A3BE6E','#D2814F','#A89BE0'];
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const PROB_CYCLE = [100, 75, 50, 25];
const LANE_FIELDS = { note: 4, mute: 5, solo: 6, volume: 7, pan: 8, bendRange: 9, swing: 10, modACc: 13, modBCc: 14 };
const RACK_FIELDS = { seed: 1, currentPattern: 2, globalSwing: 4, truncate: 5 };
const STEP_FIELDS = [
  { key: 'vel', idx: 1, label: 'Velocity', min: 1, max: 127, def: 100, fmt: v => String(v) },
  { key: 'rel', idx: 2, label: 'Release', min: 0, max: 127, def: 64, fmt: v => String(v) },
  { key: 'pitch', idx: 3, label: 'Pitch', min: -24, max: 24, def: 0, bipolar: true, fmt: v => (v > 0 ? '+' : '') + v + ' st' },
  { key: 'fine', idx: 4, label: 'Fine pitch', min: -100, max: 100, def: 0, bipolar: true, fmt: v => (v > 0 ? '+' : '') + v + ' c' },
  { key: 'pan', idx: 5, label: 'Pan', min: -64, max: 63, def: 0, bipolar: true, fmt: v => v === 0 ? 'C' : (v < 0 ? Math.abs(v) + ' L' : v + ' R') },
  { key: 'modA', idx: 6, label: 'Mod A', min: 0, max: 127, def: 64, fmt: v => String(v) },
  { key: 'modB', idx: 7, label: 'Mod B', min: 0, max: 127, def: 64, fmt: v => String(v) },
  { key: 'shift', idx: 8, label: 'Shift', min: 0, max: 9900, def: 0, fmt: v => (v / 100).toFixed(0) + '%' },
  { key: 'gate', idx: 9, label: 'Gate', min: 500, max: 160000, def: 5000, fmt: v => (v / 10000).toFixed(2) + ' st' },
  { key: 'ratchet', idx: 10, label: 'Ratchet', min: 1, max: 8, def: 1, fmt: v => 'x' + v },
  { key: 'prob', idx: 12, label: 'Probability', min: 0, max: 100, def: 100, fmt: v => v + '%' },
];

const CELL_W = 28, CELL_GAP = 3, GROUP_GAP = 6, ROW_H = 44, CELL_H = 36;
let state = { standalone: false, patternMidiChannel: 0, nonEmptyPatterns: [0], browserFolders: [], browserListing: null, lanes: [], patterns: ['Pattern 1'], pattern: 0, pendingPattern: -1, playing: false, bpm: 120, globalSwing: 0, truncate: false, seed: 0, canUndo: false, canRedo: false, error: '' };
let transport = { playing: false, bpm: 120, beat: 0, pattern: 0, pendingPattern: -1, playheads: {}, meters: {} };
let selectedSlot = 0;
let activeTab = 0;
let activeBank = 0;
let dragLaneSlot = -1;
let browserOpen = false;
let browserAutoSwap = false;
let browserFilter = '';
let browserCursor = -1;
let audioDragTail = false;
let focusCell = { slot: 0, step: 0 };
let openMenu = null;
let renamingPattern = false;
let gridDrag = null;
let barDrag = null;

function emit(action, data = {}) {
  const msg = { action, ...data };
  if (window.__JUCE__?.backend?.emitEvent) window.__JUCE__.backend.emitEvent('edit', msg);
}
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const noteName = n => NOTE_NAMES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
const currentLane = () => (state.lanes || []).find(l => l.slot === selectedSlot);
const editingInspector = () => ['INPUT', 'SELECT'].includes(document.activeElement?.tagName) && $('inspector')?.contains(document.activeElement);

function maxCols() {
  const longest = Math.max(16, ...(state.lanes || []).map(l => Number(l.length) || 16));
  return Math.min(512, Math.ceil(longest / 4) * 4);
}
function stepX(i) { return i * (CELL_W + CELL_GAP) + Math.floor(i / 4) * GROUP_GAP + 4; }
function totalGridWidth(cols) { return stepX(cols) + 8; }
function xToStep(x, cols) {
  for (let i = 0; i < cols; i++) {
    const sx = stepX(i);
    if (x >= sx - 2 && x <= sx + CELL_W + 2) return i;
  }
  return -1;
}

function setHint(text) { if ($('hintText')) $('hintText').textContent = text; }

/* ---------- Rotary SVG Knob ---------- */
function makeKnob(o) {
  const size = o.small ? 30 : 42, c = size / 2, r = c - 4;
  const ns = 'http://www.w3.org/2000/svg';
  const wrap = document.createElement('div');
  wrap.className = o.small ? 'knob small' : 'knob';
  const dial = document.createElement('div');
  dial.className = 'dial'; dial.tabIndex = 0; dial.setAttribute('role', 'slider');
  dial.setAttribute('aria-label', o.label);
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  const pt = (deg, rad) => { const a = deg * Math.PI / 180; return [c + rad * Math.sin(a), c - rad * Math.cos(a)]; };
  const arc = (a0, a1) => {
    if (a1 < a0) [a0, a1] = [a1, a0];
    if (a1 - a0 < 0.5) return '';
    const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
    return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`;
  };
  const mkPath = (stroke, w) => { const p = document.createElementNS(ns, 'path'); p.setAttribute('fill','none'); p.setAttribute('stroke', stroke); p.setAttribute('stroke-width', w); p.setAttribute('stroke-linecap','round'); svg.appendChild(p); return p; };
  mkPath('#3B342D', 3.5).setAttribute('d', arc(-135, 135));
  const valArc = mkPath(o.color || '#E2B24A', 3.5);
  const cap = document.createElementNS(ns, 'circle');
  cap.setAttribute('cx', c); cap.setAttribute('cy', c); cap.setAttribute('r', Math.max(4, r - 5)); cap.setAttribute('fill', '#2F2924');
  svg.appendChild(cap);
  const needle = mkPath('#DCD0BA', 2);
  dial.appendChild(svg);
  const out = document.createElement('output');
  let val = o.value;
  const draw = () => {
    const f = clamp((val - o.min) / (o.max - o.min || 1), 0, 1);
    const ang = -135 + 270 * f;
    valArc.setAttribute('d', arc(o.bipolar ? 0 : -135, ang));
    const [x0, y0] = pt(ang, Math.max(2, r - 11)), [x1, y1] = pt(ang, r - 5);
    needle.setAttribute('d', `M${x0} ${y0} L${x1} ${y1}`);
    out.textContent = o.fmt(val);
    dial.setAttribute('aria-valuenow', String(val));
  };
  const commit = v => {
    const snapped = o.step ? Math.round(v / o.step) * o.step : v;
    const next = +clamp(snapped, o.min, o.max).toFixed(4);
    if (next === val) return;
    val = next; draw(); o.onChange(val);
  };
  dial.addEventListener('pointerdown', e => {
    e.preventDefault(); dial.focus(); dial.setPointerCapture?.(e.pointerId);
    let lastY = e.clientY, exact = val;
    const mv = ev => {
      exact = clamp(exact + (lastY - ev.clientY) / (ev.shiftKey ? 520 : 140) * (o.max - o.min), o.min, o.max);
      lastY = ev.clientY;
      val = o.step ? +clamp(Math.round(exact / o.step) * o.step, o.min, o.max).toFixed(4) : exact;
      draw();
    };
    const up = () => { dial.removeEventListener('pointermove', mv); dial.removeEventListener('pointerup', up); o.onChange(val); };
    dial.addEventListener('pointermove', mv); dial.addEventListener('pointerup', up);
  });
  dial.addEventListener('dblclick', () => commit(o.def));
  dial.addEventListener('keydown', e => {
    const d = { ArrowUp: o.step || 1, ArrowRight: o.step || 1, ArrowDown: -(o.step || 1), ArrowLeft: -(o.step || 1) }[e.key];
    if (d === undefined) return;
    e.preventDefault(); commit(val + d);
  });
  draw();
  const lbl = document.createElement('span'); lbl.className = 'k-label'; lbl.textContent = o.label;
  if (o.small) {
    const t = document.createElement('div'); t.className = 'k-text'; t.append(lbl, out); wrap.append(dial, t);
  } else wrap.append(dial, lbl, out);
  return wrap;
}

/* ---------- Menus ---------- */
function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
function showMenu(x, y, items) {
  closeMenu();
  const el = document.createElement('div');
  el.className = 'menu'; el.setAttribute('role', 'menu');
  for (const item of items) {
    if (item === '-') { el.appendChild(document.createElement('hr')); continue; }
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = item.label;
    if (item.checked !== undefined) b.setAttribute('aria-checked', String(!!item.checked));
    if (item.danger) b.className = 'danger';
    b.addEventListener('click', () => { closeMenu(); item.action(); });
    el.appendChild(b);
  }
  document.body.appendChild(el);
  const r = el.getBoundingClientRect?.() || { width: 190, height: 220 };
  el.style.left = Math.min(x, (window.innerWidth || 1000) - r.width - 8) + 'px';
  el.style.top = Math.min(y, (window.innerHeight || 700) - r.height - 8) + 'px';
  openMenu = el;
}

/* ---------- Top Bar ---------- */
function renderTop() {
  const names = state.patterns || ['Pattern 1'];
  if (!renamingPattern && $('patternName')) $('patternName').textContent = names[state.pattern] || `Pattern ${state.pattern + 1}`;
  const pending = transport.playing ? transport.pendingPattern : state.pendingPattern;
  if ($('queuedBadge')) {
    const show = pending >= 0 && pending !== state.pattern;
    $('queuedBadge').hidden = !show;
    if (show) $('queuedBadge').textContent = `Next bar: ${names[pending] || 'Pattern ' + (pending + 1)}`;
  }
  if ($('playPill')) $('playPill').className = 'play-pill' + (transport.playing ? ' playing' : '');
  const bpm = Math.round(transport.bpm || state.bpm || 120);
  if ($('standalonePlayBtn')) {
    $('standalonePlayBtn').hidden = !state.standalone;
    $('standalonePlayBtn').textContent = transport.playing ? 'Stop' : 'Play';
    $('standalonePlayBtn').className = 'btn' + (transport.playing ? ' active' : '');
  }
  if ($('bpmText')) {
    $('bpmText').hidden = !!state.standalone;
    $('bpmText').textContent = `${bpm} BPM`;
  }
  if ($('bpmInput')) {
    $('bpmInput').hidden = !state.standalone;
    if (document.activeElement !== $('bpmInput')) $('bpmInput').value = String(bpm);
  }
  if ($('truncateBtn')) {
    $('truncateBtn').setAttribute('aria-pressed', String(!!state.truncate));
    $('truncateBtn').className = 'btn' + (state.truncate ? ' active' : '');
  }
  if ($('seedVal')) $('seedVal').textContent = String(state.seed ?? 0);
  if ($('undoBtn')) $('undoBtn').disabled = !state.canUndo;
  if ($('redoBtn')) $('redoBtn').disabled = !state.canRedo;
  if ($('error')) $('error').textContent = state.error || '';
  const slot = $('globalSwingSlot');
  if (slot && typeof document.createElementNS === 'function') {
    slot.innerHTML = '';
    slot.appendChild(makeKnob({
      label: 'Swing', small: true, min: 0, max: 10000, step: 100, def: 0, value: state.globalSwing || 0, color: '#DCD0BA',
      fmt: v => Math.round(v / 100) + '%',
      onChange: v => emit('setRack', { field: RACK_FIELDS.globalSwing, value: Math.round(v) }),
    }));
  }
}

function startInlinePatternRename() {
  renamingPattern = true;
  const wrap = $('patternWrap');
  const current = (state.patterns || [])[state.pattern] || `Pattern ${state.pattern + 1}`;
  const input = document.createElement('input');
  input.className = 'pattern-rename'; input.value = current; input.maxLength = 128;
  input.setAttribute('aria-label', 'Pattern name');
  const finish = commit => {
    renamingPattern = false;
    const val = input.value.trim();
    input.remove();
    if ($('patternBtn')) $('patternBtn').hidden = false;
    if (commit && val && val !== current) emit('renamePattern', { name: val });
    renderTop();
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
  input.addEventListener('blur', () => finish(true));
  if ($('patternBtn')) $('patternBtn').hidden = true;
  wrap.prepend(input);
  input.focus(); input.select();
}

function drawGrid() {
  const canvas = $('gridCanvas');
  if (!canvas || !canvas.getContext) return;
  const lanes = state.lanes || [];
  const cols = maxCols();
  const cssW = Math.max(520, totalGridWidth(cols));
  const cssH = Math.max(ROW_H, lanes.length * ROW_H + 8);
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  }
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#241F1B'; g.fillRect(0, 0, cssW, cssH);
  const anySolo = lanes.some(l => l.solo && !l.mute);

  for (let r = 0; r < lanes.length; r++) {
    const l = lanes[r], y = r * ROW_H + 4;
    const len = Number(l.length) || 16;
    const dimmed = l.mute || (anySolo && !l.solo);
    g.fillStyle = '#1A1613';
    g.fillRect(0, y - 2, totalGridWidth(len), CELL_H + 4);
    const playStep = transport.playheads[l.slot];

    for (let i = 0; i < len; i++) {
      const x = stepX(i), st = (l.steps && l.steps[i]) || [];
      const on = !!st[0], vel = st[1] ?? 100, rat = st[10] ?? 1, prob = st[12] ?? 100;
      g.globalAlpha = dimmed ? 0.4 : 1.0;
      g.fillStyle = (Math.floor(i / 4) % 2) ? '#322C26' : '#3B342D';
      g.fillRect(x, y, CELL_W, CELL_H);
      if (on) {
        const fh = Math.max(4, Math.round((vel / 127) * CELL_H));
        g.fillStyle = l.color || '#E2B24A';
        g.globalAlpha = (dimmed ? 0.4 : 1.0) * (0.35 + 0.65 * prob / 100);
        g.fillRect(x, y + CELL_H - fh, CELL_W, fh);
        if (prob < 100) {
          g.strokeStyle = 'rgba(26,22,19,0.55)'; g.lineWidth = 1.5;
          g.beginPath();
          for (let d = -CELL_H; d < CELL_W + CELL_H; d += 6) {
            g.moveTo(x + d, y + CELL_H); g.lineTo(x + d + fh, y + CELL_H - fh);
          }
          g.stroke();
        }
        if (rat > 1) {
          g.fillStyle = '#1A1613'; g.globalAlpha = 1;
          for (let k = 1; k < rat; k++) g.fillRect(x + Math.round(k * CELL_W / rat) - 1, y + CELL_H - fh, 2, fh);
        }
      }
      g.globalAlpha = 1;
      if (playStep === i) {
        g.fillStyle = 'rgba(244,233,210,0.18)'; g.fillRect(x, y, CELL_W, CELL_H);
        g.fillStyle = '#F4E9D2'; g.fillRect(x, y, CELL_W, 3);
      }
      if (focusCell.slot === l.slot && focusCell.step === i) {
        g.strokeStyle = '#F4E9D2'; g.lineWidth = 1.5; g.strokeRect(x + 1, y + 1, CELL_W - 2, CELL_H - 2);
      }
    }
  }
}

function drawBars() {
  const canvas = $('barsCanvas');
  if (!canvas || !canvas.getContext) return;
  const lane = currentLane();
  const cols = maxCols();
  const cssW = Math.max(520, totalGridWidth(cols)), cssH = 128;
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  }
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#1A1613'; g.fillRect(0, 0, cssW, cssH);
  if (!lane) return;
  const f = STEP_FIELDS[activeTab], len = Number(lane.length) || 16;
  if (f.bipolar) { g.fillStyle = '#3E362F'; g.fillRect(0, cssH / 2, cssW, 1); }
  for (let i = 0; i < len; i++) {
    const x = stepX(i), st = (lane.steps && lane.steps[i]) || [];
    const on = !!st[0], val = st[f.idx] ?? f.def;
    g.fillStyle = (Math.floor(i / 4) % 2) ? '#2A241F' : '#322C26';
    g.fillRect(x, 4, CELL_W, cssH - 8);
    g.fillStyle = lane.color || '#E2B24A';
    g.globalAlpha = on ? 0.92 : 0.28;
    if (f.bipolar) {
      const half = (cssH - 8) / 2;
      const frac = Math.abs(val) / Math.max(Math.abs(f.min), Math.abs(f.max));
      const bh = Math.max(2, frac * half);
      g.fillRect(x + 2, val >= 0 ? cssH / 2 - bh : cssH / 2, CELL_W - 4, bh);
    } else {
      const frac = (val - f.min) / (f.max - f.min || 1);
      const bh = Math.max(3, frac * (cssH - 8));
      g.fillRect(x + 2, cssH - 4 - bh, CELL_W - 4, bh);
    }
    g.globalAlpha = 1;
  }
}

/* ---------- Inspector ---------- */
function drawWaveform(canvas, lane) {
  if (!canvas || !canvas.getContext) return;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(200, canvas.clientWidth || 260), h = 58;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#1A1613'; g.fillRect(0, 0, w, h);
  const peaks = lane.peaks || [];
  if (peaks.length) {
    g.fillStyle = lane.color || '#E2B24A';
    const bw = w / peaks.length;
    for (let i = 0; i < peaks.length; i++) {
      const bh = Math.max(2, peaks[i] * (h - 8));
      g.fillRect(i * bw, (h - bh) / 2, Math.max(1, bw - 0.5), bh);
    }
  }
  const sx = clamp(lane.start || 0, 0, 1) * w, ex = clamp(lane.end ?? 1, 0, 1) * w;
  g.fillStyle = 'rgba(0,0,0,0.45)';
  if (sx > 0) g.fillRect(0, 0, sx, h);
  if (ex < w) g.fillRect(ex, 0, w - ex, h);
  g.fillStyle = '#F4E9D2'; g.fillRect(sx, 0, 1.5, h); g.fillRect(ex - 1.5, 0, 1.5, h);
}

function gridHit(e) {
  const canvas = $('gridCanvas'), r = canvas.getBoundingClientRect?.() || { left: 0, top: 0 };
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const row = Math.floor(y / ROW_H);
  const lane = (state.lanes || [])[row];
  if (!lane) return null;
  const step = xToStep(x, Number(lane.length) || 16);
  if (step < 0) return null;
  return { lane, step };
}
$('gridCanvas')?.addEventListener('contextmenu', e => e.preventDefault());
$('gridCanvas')?.addEventListener('pointerdown', e => {
  const hit = gridHit(e); if (!hit) return;
  e.preventDefault(); $('gridCanvas').focus?.();
  selectedSlot = hit.lane.slot; focusCell = { slot: hit.lane.slot, step: hit.step };
  emit('selectLane', { lane: hit.lane.slot });
  const st = (hit.lane.steps && hit.lane.steps[hit.step]) || [0, 100, 64, 0, 0, 0, 64, 64, 0, 5000, 1, 0, 100];
  if (e.altKey) {
    const nextProb = PROB_CYCLE[(PROB_CYCLE.indexOf(st[12] ?? 100) + 1) % PROB_CYCLE.length];
    emit('setStepsBatch', { edits: [{ lane: hit.lane.slot, step: hit.step, field: 0, value: 1 }, { lane: hit.lane.slot, step: hit.step, field: 12, value: nextProb }] });
    setHint(`Step ${hit.step + 1} probability ${nextProb}%`);
    return;
  }
  if (e.shiftKey) {
    gridDrag = { mode: 'vel', lane: hit.lane, step: hit.step, startY: e.clientY, startVel: st[1] ?? 100, val: st[1] ?? 100 };
    st[0] = 1; drawGrid();
  } else {
    const paintVal = e.button === 2 ? 0 : (st[0] ? 0 : 1);
    gridDrag = { mode: 'paint', lane: hit.lane, val: paintVal, map: new Map([[hit.step, paintVal]]) };
    st[0] = paintVal; drawGrid();
  }
  $('gridCanvas').setPointerCapture?.(e.pointerId);
});
$('gridCanvas')?.addEventListener('pointermove', e => {
  if (!gridDrag) return;
  if (gridDrag.mode === 'vel') {
    const next = clamp(Math.round(gridDrag.startVel + (gridDrag.startY - e.clientY) * 1.1), 1, 127);
    gridDrag.val = next;
    if (gridDrag.lane.steps?.[gridDrag.step]) gridDrag.lane.steps[gridDrag.step][1] = next;
    setHint(`Step ${gridDrag.step + 1} velocity ${next}`);
    drawGrid(); drawBars();
    return;
  }
  const hit = gridHit(e);
  if (!hit || hit.lane.slot !== gridDrag.lane.slot) return;
  gridDrag.map.set(hit.step, gridDrag.val);
  if (hit.lane.steps?.[hit.step]) hit.lane.steps[hit.step][0] = gridDrag.val;
  drawGrid();
});
const endGridDrag = () => {
  if (!gridDrag) return;
  const d = gridDrag; gridDrag = null;
  if (d.mode === 'vel') {
    emit('setStepsBatch', { edits: [{ lane: d.lane.slot, step: d.step, field: 0, value: 1 }, { lane: d.lane.slot, step: d.step, field: 1, value: d.val }] });
  } else {
    const edits = [...d.map.entries()].map(([step, value]) => ({ lane: d.lane.slot, step, field: 0, value }));
    emit(edits.length === 1 ? 'setStep' : 'setStepsBatch', edits.length === 1 ? edits[0] : { edits });
  }
};
$('gridCanvas')?.addEventListener('pointerup', endGridDrag);
$('gridCanvas')?.addEventListener('pointercancel', endGridDrag);
$('gridCanvas')?.addEventListener('keydown', e => {
  const lanes = state.lanes || []; if (!lanes.length) return;
  const li = Math.max(0, lanes.findIndex(l => l.slot === focusCell.slot));
  const lane = lanes[li], len = Number(lane.length) || 16;
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    const on = lane.steps?.[focusCell.step]?.[0] ? 0 : 1;
    emit('setStep', { lane: lane.slot, step: focusCell.step, field: 0, value: on });
  } else if (e.shiftKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    const cur = lane.steps?.[focusCell.step]?.[1] ?? 100;
    const next = clamp(cur + (e.key === 'ArrowUp' ? 8 : -8), 1, 127);
    emit('setStepsBatch', { edits: [{ lane: lane.slot, step: focusCell.step, field: 0, value: 1 }, { lane: lane.slot, step: focusCell.step, field: 1, value: next }] });
  } else if (e.key === 'ArrowRight') { e.preventDefault(); focusCell.step = (focusCell.step + 1) % len; drawGrid(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); focusCell.step = (focusCell.step - 1 + len) % len; drawGrid(); }
  else if (e.key === 'ArrowDown' && li + 1 < lanes.length) { e.preventDefault(); focusCell.slot = lanes[li + 1].slot; selectedSlot = focusCell.slot; renderAll(); }
  else if (e.key === 'ArrowUp' && li > 0) { e.preventDefault(); focusCell.slot = lanes[li - 1].slot; selectedSlot = focusCell.slot; renderAll(); }

  const map = {}, mMap = {};
  for (const h of (t.playheads || [])) map[h.slot] = h.step;
  for (const m of (t.meters || [])) mMap[m.slot] = m.peak;
  transport = { ...t, playheads: map, meters: mMap };
  for (const l of (state.lanes || [])) {
    const el = $('meter-' + l.slot);
    if (el) {
      const p = clamp(mMap[l.slot] || 0, 0, 1);
      el.style.height = Math.round(p * 100) + '%';
      el.style.background = p > 0.92 ? '#E8A091' : '#A3BE6E';
    }
  }
  renderTop();
  drawGrid();
};
window.__JUCE__?.backend?.addEventListener('state', window.__furrowState);
window.__JUCE__?.backend?.addEventListener('transport', window.__furrowTransport);
renderAll();
emit('ready');
</script>
</body>
