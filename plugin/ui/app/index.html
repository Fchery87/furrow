<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Furrow</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="bar-zone">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <path d="M3 4H21L18.8 8.5H3V4Z" fill="#ECEEF2"/>
            <path d="M3 10.5H16.8L14.6 14.8H3V10.5Z" fill="#ECEEF2"/>
            <rect x="3" y="16.8" width="5" height="4.2" rx="1" fill="#ECEEF2"/>
            <rect x="16" y="16.8" width="5" height="4.2" rx="1" fill="#D99B38"/>
          </svg>
        </span>
        <span class="wordmark">furrow</span>
      </div>

      <button class="btn ghost" id="browserToggleBtn" aria-pressed="false" title="Toggle sample library browser (B)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 1.5h4.5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5v-7Z"/>
        </svg>
        <span class="btn-label">Browser</span>
      </button>

      <div class="pattern-pill" id="patternWrap">
        <button class="pat-nav" id="patPrevBtn" title="Previous pattern" aria-label="Previous pattern">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7.5 2.5 4 6l3.5 3.5"/></svg>
        </button>
        <button class="pat-trigger" id="patternBtn" aria-haspopup="dialog" title="Open 256-pattern bank">
          <span class="pat-idx" id="patternIdx">01</span>
          <span class="pat-title" id="patternName">Pattern 1</span>
          <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3"/></svg>
        </button>
        <button class="pat-nav" id="patNextBtn" title="Next pattern" aria-label="Next pattern">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>
        </button>
      </div>
      <span class="queued-chip" id="queuedBadge" hidden></span>
    </div>

    <div class="bar-zone">
      <div class="transport-cluster" id="playPill" title="Transport state, tempo, and global swing">
        <button class="play-btn" id="standalonePlayBtn" hidden aria-pressed="false" title="Play or stop standalone transport (Space)">Play</button>
        <span class="play-dot" id="playDot" aria-hidden="true"></span>
        <span class="bpm-readout" id="bpmText">120 BPM</span>
        <label class="bpm-wrap" id="bpmWrap" hidden title="Drag vertically or type BPM">
          <input class="bpm-input" id="bpmInput" type="number" min="20" max="300" step="1" value="120" aria-label="Standalone BPM">
          <span class="bpm-unit">BPM</span>
        </label>
        <div class="inline-swing" id="globalSwingSlot"></div>
      </div>

      <button class="btn ghost" id="grooveBtn" aria-haspopup="dialog" title="Swing truncate and probability seed">
        <span class="btn-label">Groove</span>
        <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3"/></svg>
      </button>
    </div>

    <div class="bar-zone">
      <button class="btn ghost icon-only" id="undoBtn" data-action="undo" disabled title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h5.5a3.5 3.5 0 1 1 0 7H7"/><path d="M6.5 3.5 4 6l2.5 2.5"/></svg>
      </button>
      <button class="btn ghost icon-only" id="redoBtn" data-action="redo" disabled title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6H6.5a3.5 3.5 0 1 0 0 7H9"/><path d="M9.5 3.5 12 6 9.5 8.5"/></svg>
      </button>

      <div class="divider"></div>

      <div class="drag-group" title="Drag onto your DAW timeline">
        <button class="drag-chip" id="dragMidiBtn" title="Drag pattern onto host timeline as MIDI (.mid)"><span class="grip" aria-hidden="true">⋮⋮</span>MIDI</button>
        <button class="drag-chip" id="dragWavBtn" title="Drag pattern onto host timeline as 24-bit WAV"><span class="grip" aria-hidden="true">⋮⋮</span>WAV</button>
        <button class="tail-toggle" id="wavTailBtn" aria-pressed="false" title="Include up to 2 seconds of ringing tail on WAV drag">Tail</button>
      </div>

      <button class="btn ghost" id="fileMenuBtn" aria-haspopup="menu" title="Kits, MIDI export, MIDI import, and sample relink">
        <span class="btn-label">Kit</span>
        <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3"/></svg>
      </button>

      <button class="btn danger" id="panicBtn" data-action="panic" title="Stop all playing voices and send All Notes Off">Panic</button>

      <button class="btn ghost icon-only" id="fullscreenBtn" hidden title="Toggle fullscreen (F11)" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/>
        </svg>
      </button>

      <button class="btn ghost icon-only active" id="inspectorToggleBtn" aria-pressed="true" title="Toggle lane inspector (I)" aria-label="Toggle lane inspector">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2.5" width="12" height="11" rx="2"/>
          <line x1="10" y1="2.5" x2="10" y2="13.5"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="workspace" id="mainLayout">
    <aside class="browser" id="browserPane" hidden aria-label="Sample browser">
      <div class="pane-header">
        <span class="pane-title">Samples</span>
        <div class="pane-actions">
          <button class="btn mini-btn" id="browserAutoSwapBtn" aria-pressed="false" title="Hot-swap selected lane live with Up/Down arrow keys">Auto-swap</button>
          <button class="btn mini-btn icon-only" id="browserAddFolderBtn" title="Add sample folder" aria-label="Add sample folder">+</button>
        </div>
      </div>
      <div class="browser-body">
        <div class="browser-roots" id="browserRoots"></div>
        <div class="browser-nav">
          <button class="btn mini-btn" id="browserUpBtn" disabled title="Parent folder">..</button>
          <input class="browser-filter" id="browserFilterInput" type="search" placeholder="Filter samples..." aria-label="Filter browser">
        </div>
        <div class="browser-breadcrumb" id="browserBreadcrumb"></div>
        <div class="browser-list" id="browserList" tabindex="0" role="listbox" aria-label="Sample files"></div>
      </div>
    </aside>

    <div class="center-col" id="centerCol">
      <div class="midi-banner" id="midiPreviewBar" hidden></div>

      <section class="rack-wrap" aria-label="Pattern rack">
        <div class="rack-subheader">
          <div class="rack-corner">
            <span class="rack-corner-title">Lanes</span>
            <div class="zoom-pills" id="zoomPills" title="Step cell width">
              <button data-zoom="24">S</button>
              <button data-zoom="30" class="active">M</button>
              <button data-zoom="fit">Fit</button>
            </div>
          </div>
          <div class="ruler-viewport">
            <canvas id="rulerCanvas"></canvas>
          </div>
        </div>
        <div class="rack-body">
          <div class="lane-headers" id="laneHeaders"></div>
          <div class="grid-scroll" id="gridScroll">
            <canvas id="gridCanvas" tabindex="0" aria-label="Step grid"></canvas>
          </div>
        </div>
      </section>

      <section class="editor" aria-label="Step lane editor">
        <div class="editor-bar">
          <button class="editor-toggle" id="editorToggleBtn" aria-expanded="true">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3"/></svg>
            <span>Step Lanes</span>
          </button>
          <div class="step-tabs" id="stepTabs" role="tablist" aria-orientation="horizontal"></div>
          <span class="editor-lane-tag" id="editorLaneTag">
            <span class="editor-lane-dot" id="editorLaneDot"></span>
            <span id="editorLaneName"></span>
          </span>
        </div>
        <div class="editor-body">
          <div class="editor-axis">
            <div class="axis-info">
              <span class="axis-name" id="axisTitle">Velocity</span>
              <span class="axis-help" id="axisHelp">Drag bars to draw values. Double-click to reset.</span>
            </div>
            <div class="axis-scale" id="axisScale"><span>1</span><span>64</span><span>127</span></div>
          </div>
          <div class="bars-scroll" id="barsScroll">
            <canvas id="barsCanvas" aria-label="Step parameter bars"></canvas>
          </div>
        </div>
      </section>
    </div>

    <aside class="inspector" id="inspectorPane" aria-label="Lane inspector">
      <div class="inspector-scroll" id="inspector"></div>
    </aside>
  </main>

  <footer class="hint">
    <span class="hint-text" id="hintText">Click to toggle, drag to paint, right-drag to erase, Shift-drag for velocity, Alt-click for probability.</span>
    <span class="error-text" id="error" role="alert"></span>
  </footer>
</div>
</body>
</html>
